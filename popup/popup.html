<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auris</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
          <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="app-name">Auris</span>
      </div>
      <label class="toggle master-toggle">
        <input type="checkbox" id="masterEnabled" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </header>

    <div id="mainContent" class="main-content disabled-overlay">
      <!-- Gain & Volume -->
      <section class="section">
        <div class="param-row">
          <span class="param-label">Gain</span>
          <input type="range" id="gainSlider" class="slider" min="0.5" max="4" step="0.01" value="1" />
          <span class="param-value" id="gainValue">+0.0 dB</span>
        </div>
        <div class="param-row">
          <span class="param-label">Volume</span>
          <input type="range" id="volumeSlider" class="slider" min="0" max="100" step="1" value="100" />
          <span class="param-value" id="volumeValue">100%</span>
        </div>
      </section>

      <div class="divider"></div>

      <!-- EQ -->
      <section class="section" id="eqSection">
        <div class="section-header">
          <span class="section-title">EQ</span>
          <label class="toggle">
            <input type="checkbox" id="eqEnabled" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
        <div class="eq-container" id="eqEnabled-content">
          <div class="eq-bands" id="eqBands">
            <!-- Generated by JS -->
          </div>
          <div class="eq-labels">
            <span>31</span><span>62</span><span>125</span><span>250</span><span>500</span>
            <span>1k</span><span>2k</span><span>4k</span><span>8k</span><span>16k</span>
          </div>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Compressor -->
      <section class="section">
        <div class="section-header">
          <span class="section-title">Compressor</span>
          <label class="toggle">
            <input type="checkbox" id="compEnabled" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
        <div class="effect-params" id="compEnabled-content">
          <div class="param-row">
            <span class="param-label">Threshold</span>
            <input type="range" id="compThreshold" class="slider" min="-60" max="0" step="1" value="-24" />
            <span class="param-value" id="compThresholdValue">-24 dB</span>
          </div>
          <div class="param-row">
            <span class="param-label">Ratio</span>
            <input type="range" id="compRatio" class="slider" min="1" max="20" step="0.5" value="4" />
            <span class="param-value" id="compRatioValue">4:1</span>
          </div>
          <div class="param-row">
            <span class="param-label">Attack</span>
            <input type="range" id="compAttack" class="slider" min="0.001" max="1" step="0.001" value="0.003" />
            <span class="param-value" id="compAttackValue">3 ms</span>
          </div>
          <div class="param-row">
            <span class="param-label">Release</span>
            <input type="range" id="compRelease" class="slider" min="0.01" max="2" step="0.01" value="0.25" />
            <span class="param-value" id="compReleaseValue">250 ms</span>
          </div>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Limiter -->
      <section class="section">
        <div class="section-header">
          <span class="section-title">Limiter</span>
          <label class="toggle">
            <input type="checkbox" id="limiterEnabled" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Mono -->
      <section class="section">
        <div class="section-header">
          <span class="section-title">Mono</span>
          <label class="toggle">
            <input type="checkbox" id="monoEnabled" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Noise Gate -->
      <section class="section">
        <div class="section-header">
          <span class="section-title">Noise Gate</span>
          <label class="toggle">
            <input type="checkbox" id="ngEnabled" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
        <div class="effect-params" id="ngEnabled-content">
          <div class="param-row">
            <span class="param-label">Threshold</span>
            <input type="range" id="ngThreshold" class="slider" min="-80" max="0" step="1" value="-50" />
            <span class="param-value" id="ngThresholdValue">-50 dB</span>
          </div>
          <div class="param-row">
            <span class="param-label">Attack</span>
            <input type="range" id="ngAttack" class="slider" min="0.001" max="1" step="0.001" value="0.003" />
            <span class="param-value" id="ngAttackValue">3 ms</span>
          </div>
          <div class="param-row">
            <span class="param-label">Release</span>
            <input type="range" id="ngRelease" class="slider" min="0.01" max="2" step="0.01" value="0.25" />
            <span class="param-value" id="ngReleaseValue">250 ms</span>
          </div>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Preset -->
      <section class="section preset-section">
        <button class="btn btn-outline" id="savePreset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Save Preset
        </button>
        <label class="btn btn-outline" id="loadPresetLabel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Load Preset
          <input type="file" id="loadPresetInput" accept=".json" hidden />
        </label>
        <button class="btn btn-outline btn-icon" id="resetAll" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-4.95"/>
          </svg>
        </button>
      </section>
    </div>

    <div id="noPageWarning" class="warning hidden">
      Cannot access this page's audio.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
